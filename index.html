<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Laiba-urooj • Instagram</title>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background:#fff;
    color:#262626;
  }
  a{ text-decoration:none; color:inherit; }

  /* ===== LAYOUT ===== */
  .app{ display:flex; min-height:100vh; }

  /* ===== SIDEBAR ===== */
  .sidebar{
    width:245px;
    flex-shrink:0;
    border-right:1px solid #dbdbdb;
    padding:20px 12px;
    display:flex;
    flex-direction:column;
    height:100vh;
    position:sticky;
    top:0;
  }
  .logo{
    font-family:Georgia, 'Times New Roman', serif;
    font-size:26px;
    font-weight:600;
    padding:12px 12px 24px;
  }
  .nav{ display:flex; flex-direction:column; gap:2px; flex:1; }
  .nav-item{
    display:flex;
    align-items:center;
    gap:16px;
    padding:12px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
  }
  .nav-item:hover{ background:#fafafa; }
  .nav-item.active{ font-weight:700; }
  .nav-item svg{ width:24px; height:24px; flex-shrink:0; }
  .nav-item .avatar-icon{
    width:24px; height:24px; border-radius:50%;
    background:#efefef; display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:700; color:#8e8e8e; overflow:hidden;
  }
  .nav-label{ white-space:nowrap; }

  /* ===== MAIN ===== */
  .main{ flex:1; max-width:975px; margin:0 auto; padding:30px 20px; }

  .profile-header{ display:flex; gap:30px; padding:0 0 44px; flex-wrap:wrap; }
  .avatar{
    width:150px; height:150px; border-radius:50%;
    background:linear-gradient(135deg,#f5a3c7,#c9a6f5);
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:48px; font-weight:600;
    overflow:hidden;
  }
  .avatar img{ width:100%; height:100%; object-fit:cover; }
  .profile-info{ flex:1; min-width:240px; }
  .profile-top{ display:flex; align-items:center; gap:20px; flex-wrap:wrap; margin-bottom:20px; }
  .username{ font-size:28px; font-weight:300; }
  .btn{
    padding:7px 16px;
    border-radius:8px;
    border:1px solid #dbdbdb;
    background:#efefef;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  .btn:hover{ background:#dbdbdb; }
  .stats{ display:flex; gap:36px; margin-bottom:20px; font-size:16px; }
  .stats b{ font-weight:600; }
  .bio{ font-size:14px; line-height:1.5; }
  .bio .name{ font-weight:600; }

  .highlights{ display:flex; gap:24px; padding:20px 0 30px; overflow-x:auto; }
  .highlight{ display:flex; flex-direction:column; align-items:center; gap:8px; flex-shrink:0; }
  .highlight-circle{
    width:77px; height:77px; border-radius:50%;
    border:1px solid #dbdbdb;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .highlight-circle img{ width:100%; height:100%; object-fit:cover; }
  .highlight-circle.new{ font-size:26px; color:#262626; border-style:solid; }
  .highlight span{ font-size:12px; }

  .tabs{
    display:flex;
    justify-content:center;
    gap:60px;
    border-top:1px solid #dbdbdb;
  }
  .tab{
    display:flex; align-items:center; gap:6px;
    padding:16px 0;
    font-size:12px;
    font-weight:600;
    letter-spacing:.5px;
    color:#8e8e8e;
    cursor:pointer;
    border-top:1px solid transparent;
    margin-top:-1px;
  }
  .tab.active{ color:#262626; border-top:1px solid #262626; }
  .tab svg{ width:12px; height:12px; }

  .grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:4px;
    padding-top:4px;
  }
  .grid-item{
    aspect-ratio:1/1;
    background:#efefef;
    overflow:hidden;
  }
  .grid-item img{ width:100%; height:100%; object-fit:cover; display:block; }

  /* ===== MOBILE BOTTOM NAV ===== */
  .bottom-nav{
    display:none;
    position:fixed;
    bottom:0; left:0; right:0;
    background:#fff;
    border-top:1px solid #dbdbdb;
    justify-content:space-around;
    align-items:center;
    padding:10px 6px;
    z-index:10;
  }
  .bottom-nav svg{ width:24px; height:24px; }
  .bottom-nav .avatar-icon{
    width:24px; height:24px; border-radius:50%; overflow:hidden;
    background:linear-gradient(135deg,#f5a3c7,#c9a6f5);
  }
  .bottom-nav .avatar-icon img{ width:100%; height:100%; object-fit:cover; }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 1264px){
    .sidebar{ width:88px; align-items:center; }
    .logo{ display:none; }
    .nav-label{ display:none; }
    .nav-item{ justify-content:center; }
  }

  @media (max-width: 768px){
    .sidebar{ display:none; }
    .bottom-nav{ display:flex; }
    .main{ padding:20px 12px 80px; }
    .profile-header{ gap:16px; }
    .avatar{ width:90px; height:90px; font-size:30px; }
    .username{ font-size:20px; }
    .stats{ gap:20px; font-size:14px; }
    .grid{ gap:2px; }
    .highlight-circle{ width:64px; height:64px; }
  }
</style>
</head>
<body>
